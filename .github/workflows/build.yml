name: Build
on: [push, pull_request]

jobs:
  build-android:
    name: build-android-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [armv7a, arm64]

    env:
      # waf (--use-ccache) puts the cache in <workspace>/.ccache/<cc>/<os>/<cpu>.
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 1500M
      # The NDK is pinned (r10e), so key the compiler check on that instead of
      # hashing the compiler binaries on every invocation. Change this string
      # if the NDK version in the setup step below changes.
      CCACHE_COMPILERCHECK: string:android-ndk-r10e

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NDK and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ccache

          if [ ! -d android-ndk-r10e ]; then
            wget -q --tries=3 https://dl.google.com/android/repository/android-ndk-r10e-linux-x86_64.zip
            unzip -q android-ndk-r10e-linux-x86_64.zip
            rm -f android-ndk-r10e-linux-x86_64.zip
          fi

          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r10e/" >> "$GITHUB_ENV"
          echo "NDK_HOME=$PWD/android-ndk-r10e/" >> "$GITHUB_ENV"
          ccache --version | head -n 1

      # Restore the newest cache for this arch. Saving is done separately below
      # with `if: always()` so a failed build still keeps what it compiled.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.arch }}-

      - name: Build android-${{ matrix.arch }}
        run: |
          chmod +x scripts/build-android-${{ matrix.arch }}.sh
          ./scripts/build-android-${{ matrix.arch }}.sh

      # Everything the launcher APK needs for this ABI, flattened into
      # apklibs/<abi>/. libSDL2.so is a prebuilt from the `lib` submodule (it is
      # only copied by `waf install`), so it is not in build/ and must be added
      # explicitly. The STL is linked statically, no other runtime .so is needed.
      - name: Collect APK libraries
        run: |
          set -eu
          case "${{ matrix.arch }}" in
            arm64)  ABI=arm64-v8a ;;
            armv7a) ABI=armeabi-v7a ;;
            *) echo "::error::unknown arch ${{ matrix.arch }}"; exit 1 ;;
          esac
          CPU=$(sed -n "s/^DEST_CPU *= *'\(.*\)'.*/\1/p" build/c4che/_cache.py | head -n 1)
          echo "ABI=$ABI DEST_CPU=$CPU"

          mkdir -p "apklibs/$ABI"
          find build -name '*.so' -type f | sed 's|.*/||' | sort | uniq -d | sed 's/^/::warning::duplicate library name, keeping the first: /'
          find build -name '*.so' -type f -exec cp -n {} "apklibs/$ABI/" \;

          SDL="lib/android/$CPU/libSDL2.so"
          if [ ! -f "$SDL" ]; then
            echo "::error::$SDL not found"
            ls -R lib/android | head -n 40
            exit 1
          fi
          cp "$SDL" "apklibs/$ABI/"
          ls -l "apklibs/$ABI"

      - name: ccache stats
        if: always()
        run: |
          for d in $(find .ccache -mindepth 3 -maxdepth 3 -type d 2>/dev/null); do
            echo "== $d"
            CCACHE_DIR="$PWD/$d" ccache -s || true
          done

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.arch }}-${{ github.sha }}

      # Hand the libraries to package-apk through the Actions cache instead of an
      # artifact: artifacts of a public repo can be downloaded by any signed-in
      # GitHub user, cache entries cannot be downloaded at all.
      - name: Pass libraries to package-apk
        uses: actions/cache/save@v4
        with:
          path: apklibs
          key: apklibs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

  # Builds the launcher (Star1xr/srcengoveye, private, Gradle) with the native
  # libraries from the build job(s) into one debug-signed APK. Runs even if one
  # architecture failed, so you still get an APK for the other one.
  package-apk:
    name: package-apk
    needs: build-android
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    env:
      LAUNCHER_REPO: Star1xr/srcengoveye
      LAUNCHER_TOKEN: ${{ secrets.LAUNCHER_TOKEN }}
      ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      SDK_CMDTOOLS: commandlinetools-linux-11076708_latest
      SDK_PACKAGES: platforms;android-29 build-tools;33.0.1

    steps:
      # The launcher repo is private, so the default GITHUB_TOKEN cannot read it.
      # Add a fine-grained PAT (Contents: read on the launcher repo) as the
      # repository secret LAUNCHER_TOKEN.
      - name: Check launcher access token
        id: tok
        run: |
          if [ -z "$LAUNCHER_TOKEN" ] || [ -z "$ZIP_PASSWORD" ]; then
            echo "::warning::Secret LAUNCHER_TOKEN (read access to $LAUNCHER_REPO) and ZIP_PASSWORD must both be set, skipping the APK."
            echo "have=false" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout launcher
        if: steps.tok.outputs.have == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LAUNCHER_REPO }}
          ref: android-fixes
          token: ${{ secrets.LAUNCHER_TOKEN }}
          path: launcher

      - name: Restore native libraries (armv7a)
        if: steps.tok.outputs.have == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apklibs
          key: apklibs-${{ github.run_id }}-${{ github.run_attempt }}-armv7a

      - name: Restore native libraries (arm64)
        if: steps.tok.outputs.have == 'true'
        uses: actions/cache/restore@v4
        with:
          path: apklibs
          key: apklibs-${{ github.run_id }}-${{ github.run_attempt }}-arm64

      - name: Copy native libraries into the launcher
        if: steps.tok.outputs.have == 'true'
        run: |
          set -eu
          [ -d apklibs ] || { echo "::error::no native libraries were built"; exit 1; }
          mkdir -p launcher/libs
          cp -r apklibs/* launcher/libs/
          ls launcher/libs

      # Every ABI that is packaged must have the launcher entry point and SDL2,
      # otherwise the app fails at startup with UnsatisfiedLinkError.
      - name: Verify native libraries
        if: steps.tok.outputs.have == 'true'
        working-directory: launcher
        run: |
          set -eu
          [ -d libs ] && [ -n "$(ls -A libs)" ] || { echo "::error::no native libraries were built"; exit 1; }
          for d in libs/*/; do
            for f in libSDL2.so liblauncher.so libengine.so; do
              [ -f "$d$f" ] || { echo "::error::$d$f is missing"; exit 1; }
            done
            echo "$d: $(ls "$d" | wc -l) libraries"
          done

      - name: Cache Android SDK
        if: steps.tok.outputs.have == 'true'
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: android-sdk
          key: android-sdk-${{ env.SDK_CMDTOOLS }}-${{ env.SDK_PACKAGES }}

      - name: Install Android SDK
        if: steps.tok.outputs.have == 'true' && steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o cmdtools.zip "https://dl.google.com/android/repository/$SDK_CMDTOOLS.zip"
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          rm -f cmdtools.zip
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" $SDK_PACKAGES > /dev/null

      - name: Cache Gradle
        if: steps.tok.outputs.have == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('launcher/**/*.gradle', 'launcher/gradle/wrapper/gradle-wrapper.properties', 'launcher/gradle.properties') }}
          restore-keys: gradle-

      # Gradle 8.3 / AGP 8.1 need JDK 17; the runner's default JAVA_HOME may be
      # newer and unparsable, so point at the preinstalled 17 explicitly.
      - name: Build APK
        if: steps.tok.outputs.have == 'true'
        working-directory: launcher
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          mkdir -p "$HOME/.android" && cp debug.keystore "$HOME/.android/"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --build-cache --parallel
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/srceng-debug.apk
          echo "### APK contents" >> "$GITHUB_STEP_SUMMARY"
          unzip -l out/srceng-debug.apk | grep -E "lib/|classes.*dex|AndroidManifest|extras_dir" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          ls -l out/srceng-debug.apk

      # The APK alone in an AES-256 zip protected by ZIP_PASSWORD, so only
      # whoever knows the password can open what the artifact contains.
      # archive: false uploads the zip itself (single file only; the artifact is
      # named after the file, so no `name` here).
      - name: Zip the APK with a password
        if: steps.tok.outputs.have == 'true'
        working-directory: launcher
        run: |
          set -eu
          command -v 7z >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq --no-install-recommends p7zip-full; }
          (cd out && 7z a -tzip -mem=AES256 -p"$ZIP_PASSWORD" srceng-private.zip srceng-debug.apk > /dev/null)
          ls -l out/srceng-private.zip

      - name: Upload APK zip
        if: steps.tok.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: launcher/out/srceng-private.zip
          archive: false
          if-no-files-found: error
